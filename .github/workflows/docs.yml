name: docs

# The documentation site is a Canon program: `docs/src/main.can` is the
# Elm-architecture web app, and it renders the `docs/src/*.md` pages with
# the standard library's Markdown renderer, compiled to a WebAssembly
# module. The landing page (`docs/landing/`) is served at the site root
# and the app under `/doc/`, with the standard library's generated API
# reference (`canon doc`) beside it at `/doc/api/`.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      # The app is compiled by the canon compiler and renders the docs
      # through the stdlib Markdown renderer, so compiler and stdlib
      # changes rebuild the site.
      - "src/**"
      - "packages/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "src/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the canon compiler
        run: cargo build --release

      - name: Build the docs app (Canon → WebAssembly)
        run: target/release/canon build docs

      - name: Render the standard library's API reference
        run: |
          target/release/canon doc packages/canon
          cp -r packages/canon/build/doc docs/build/api

      - name: Build the compiler for the browser (the playground)
        run: |
          cargo build --lib --profile playground --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/playground/canon.wasm \
            docs/build/canon-compiler.wasm

      - name: Wire in the progressive enhancement (highlight + run)
        run: |
          cp docs/assets/canon-play.js docs/assets/docs-enhance.js docs/build/
          sed -i \
            's#<script src="canon-web.js"></script>#<script src="canon-web.js"></script>\n<script src="canon-play.js"></script>\n<script src="docs-enhance.js"></script>#' \
            docs/build/index.html
          # sed -i exits 0 on no match; without this check a drift in
          # webhost.rs's index template ships a site with no highlighting
          # or run buttons and CI stays green.
          grep -q 'docs-enhance.js' docs/build/index.html
          grep -q 'canon-play.js' docs/build/index.html

      - name: Assemble site (landing at /, docs app under /doc/)
        run: |
          mkdir -p site/doc
          cp -r docs/landing/. site/
          cp -r docs/build/. site/doc/

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
